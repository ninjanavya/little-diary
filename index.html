<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little Diary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ====================================================================
       1. DIARY COVER SCREEN (PASSWORD PROTECTED)
       ==================================================================== -->
  <main id="cover-screen" class="screen active">
    <div class="cover-card">
      <div class="cover-badge">✦ digital memories ✦</div>
      <h1 class="cover-title">Our Little Diary</h1>
      <p class="cover-subtitle">A collection of moments, memories & us</p>
      <div class="cover-divider"></div>

      <!-- Passcode Protection Input -->
      <div class="passcode-section">
        <label for="passcode-input" class="passcode-label">🔒 Enter Secret Passcode</label>
        <input type="password" id="passcode-input" class="passcode-input" placeholder="••••" autocomplete="off" maxlength="20">
        <div id="passcode-error" class="passcode-error"></div>
      </div>

      <button id="open-diary-btn" class="btn-primary">
        <span>Open Diary</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- ====================================================================
       2. DIARY VIEW SCREEN
       ==================================================================== -->
  <main id="diary-screen" class="screen">
    <!-- Header -->
    <header class="diary-header">
      <div id="cover-link" class="diary-title-nav" title="Lock & Return to cover">
        <h2 class="diary-header-title">Our Little Diary</h2>
        <span class="lock-indicator" title="Lock diary">🔒</span>
      </div>
      <div class="diary-header-actions">
        <button id="change-passcode-btn" class="btn-secondary" title="Change Secret Passcode">
          <span>🔑 PIN</span>
        </button>
        <button id="manage-pages-btn" class="btn-secondary" title="View all pages & reorder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          <span>Pages</span>
        </button>
        <button id="add-page-btn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Add Page</span>
        </button>
      </div>
    </header>

    <!-- Hidden File Input -->
    <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg, image/webp" multiple>

    <!-- Main Paper Container -->
    <section class="paper-frame">
      <!-- Empty State -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">📖</div>
        <h3 class="empty-title">Your Diary is Empty</h3>
        <p class="empty-desc">Upload your finished Canva diary pages (PNG/JPG) to begin creating your digital diary.</p>
        <button id="empty-add-btn" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Add First Page</span>
        </button>
      </div>

      <!-- Canva Image Container -->
      <div id="viewer-container" style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center;">
        <img id="canva-image" class="canva-image" src="" alt="Diary Page">
      </div>
    </section>

    <!-- Navigation & Page Controls -->
    <footer class="diary-controls">
      <!-- Nav Previous / Next -->
      <div class="nav-group">
        <button id="prev-btn" class="btn-secondary" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
          <span>Previous</span>
        </button>

        <span id="page-counter" class="page-counter">Page 00 / 00</span>

        <button id="next-btn" class="btn-secondary" disabled>
          <span>Next</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <!-- Management Controls: Move Left, Move Right, Delete -->
      <div class="management-group">
        <button id="move-left-btn" class="btn-secondary" title="Move page left" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/>
          </svg>
          <span>Move Left</span>
        </button>
        <button id="move-right-btn" class="btn-secondary" title="Move page right" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 17l5-5-5-5M6 17l5-5-5-5"/>
          </svg>
          <span>Move Right</span>
        </button>
        <button id="delete-btn" class="btn-danger" title="Delete current page" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <span>Delete Page</span>
        </button>
      </div>
    </footer>
  </main>

  <!-- ====================================================================
       3. MANAGE & REORDER PAGES MODAL
       ==================================================================== -->
  <div id="manage-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">All Diary Pages</h3>
        <button id="modal-close-btn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="reorder-grid" class="reorder-grid">
          <!-- Dynamically populated page thumbnails -->
        </div>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
